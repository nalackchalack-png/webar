<!DOCTYPE html>
<html>
<head>
    <title>Visor WebAR</title>
    <!-- Carga de librerías para la cámara y la realidad aumentada -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0px; overflow: hidden;">
<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-assets>
        <!-- Aquí se cargará dinámicamente la imagen recibida -->
        <img id="imagen-proyectada" src="" crossorigin="anonymous" />
    </a-assets>

    <!-- Marcador tipo Hiro para proyectar la imagen encima -->
    <a-marker preset="hiro">
        <a-plane position="0 0.5 0" rotation="-90 0 0" width="2" height="2" material="src: #imagen-proyectada; transparent: true;"></a-plane>
    </a-marker>

    <a-entity camera></a-entity>
</a-scene>

<script>

    const urlParams = new URLSearchParams(window.location.search);
    const imagenUrl = urlParams.get('img');

    if (imagenUrl) {
        document.getElementById('imagen-proyectada').setAttribute('src', imagenUrl);
    }
</script>
</body>
</html>
