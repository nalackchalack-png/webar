<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor WebAR</title>
    <!-- Librerías estables de A-Frame y AR.js -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://ar-js-org.github.io/AR.js/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    
    <!-- Texto de diagnóstico en la pantalla del celular -->
    <div id="debug-info" style="position: fixed; top: 10px; left: 10px; z-index: 9999; background: rgba(0,0,0,0.85); color: white; padding: 10px; font-family: sans-serif; font-size: 12px; max-width: 90%; word-break: break-all; border-radius: 5px;">
      Cargando WebAR...
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-assets>
        <!-- Elemento de imagen dinámico con soporte CORS -->
        <img id="img-dinamica" crossorigin="anonymous">
      </a-assets>

      <!-- Marcador Hiro -->
      <a-marker preset="hiro" id="marcador-hiro">
        <!-- Plano donde se proyecta la imagen -->
        <a-plane id="plano-ar" position="0 0.1 0" rotation="-90 0 0" width="2" height="2" material="src: #img-dinamica; transparent: true; side: double;"></a-plane>
        
        <!-- Cubo rojo 3D de prueba (si aparece esto, la cámara SÍ reconoce el marcador) -->
        <a-box position="0 0.5 0" material="color: red; opacity: 0.6;" scale="0.3 0.3 0.3"></a-box>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const debugDiv = document.getElementById('debug-info');
        const urlParams = new URLSearchParams(window.location.search);
        const imagenUrl = urlParams.get('img');

        if (imagenUrl) {
          debugDiv.innerHTML = "<b>Imagen cargada:</b><br>" + imagenUrl;
          const imgElem = document.getElementById('img-dinamica');
          imgElem.src = imagenUrl;
        } else {
          debugDiv.innerHTML = "<b style='color: #ff5555;'>⚠️ No se recibió la URL de la imagen en el enlace QR.</b>";
        }

        const marker = document.getElementById('marcador-hiro');
        marker.addEventListener('markerFound', () => {
          debugDiv.innerHTML += "<br><b style='color: #55ff55;'>¡Marcador Hiro Detectado!</b>";
        });
        marker.addEventListener('markerLost', () => {
          debugDiv.innerHTML += "<br><b style='color: #ffaa00;'>Marcador perdido.</b>";
        });
      });
    </script>
  </body>
</html>
