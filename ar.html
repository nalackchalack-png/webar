<!DOCTYPE html>
<html>
  <head>
    <title>Visor WebAR</title>
    <!-- Librerías A-Frame y AR.js -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- Marcador Hiro -->
      <a-marker preset="hiro" id="marcador-hiro">
        <!-- Plano 3D donde se proyecta la imagen -->
        <a-plane id="plano-imagen" position="0 0.1 0" rotation="-90 0 0" width="2" height="2" material="transparent: true; side: double;"></a-plane>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // Obtener el parámetro ?img= de la URL
      const urlParams = new URLSearchParams(window.location.search);
      const imagenUrl = urlParams.get('img');

      if (imagenUrl) {
        const plano = document.getElementById('plano-imagen');
        // Asignar la URL cargada dinámicamente al material del plano 3D
        plano.setAttribute('material', 'src: ' + imagenUrl + '; transparent: true;');
      }
    </script>
  </body>
</html>
