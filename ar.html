<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Visor WebAR</title>
    <!-- Librerías de A-Frame y AR.js -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://ar-js-org.github.io/AR.js/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- Contenedor de la imagen -->
      <a-assets>
        <img id="textura" crossorigin="anonymous">
      </a-assets>

      <!-- Marcador Hiro -->
      <a-marker preset="hiro">
        <!-- Plano 3D donde se proyecta la imagen -->
        <a-plane id="plano" position="0 0.1 0" rotation="-90 0 0" width="2" height="2" material="src: #textura; transparent: true; side: double;"></a-plane>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // Extraer el enlace de la imagen que viene en el QR (?img=...)
      const params = new URLSearchParams(window.location.search);
      const urlImagen = params.get('img');

      if (urlImagen) {
        const imgElement = document.getElementById('textura');
        imgElement.src = urlImagen;
      }
    </script>
  </body>
</html>
